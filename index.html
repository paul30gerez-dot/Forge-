<style>
  :root{
    --bg:#151617;
    --bg-2:#0f1010;
    --surface:#1e2022;
    --surface-2:#26282b;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.14);
    --text:#f2f2ef;
    --text-muted:#8b8e92;
    --text-dim:#5c5f63;
    --volt:#c6ff3d;
    --volt-dim: rgba(198,255,61,0.14);
    --ember:#ff5a36;
    --ember-dim: rgba(255,90,54,0.14);
    --steel:#4da8da;
    --steel-dim: rgba(77,168,218,0.14);
    --kb:#e8b64c;
    --kb-dim: rgba(232,182,76,0.14);
    --violet:#a389f4;
    --violet-dim: rgba(163,137,244,0.14);
    --radius: 16px;
    --radius-sm: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg);}
  body{
    font-family:'Inter', sans-serif;
    color:var(--text);
    overscroll-behavior-y: none;
  }
  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(198,255,61,0.06), transparent 60%),
      var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .display{ font-family:'Anton', sans-serif; letter-spacing:0.5px; text-transform:uppercase; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  #app{ flex:1; padding: 20px 18px calc(96px + var(--safe-bottom)); }
  ::-webkit-scrollbar{ width:0; height:0; }

  /* ---------- Top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:22px; min-height:34px; }
  .topbar .back{
    width:36px; height:36px; border-radius:50%; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .topbar .back:active{ background:var(--surface-2); }
  .topbar h1{ font-size:22px; margin:0; line-height:1; }
  .topbar .sub{ color:var(--text-muted); font-size:12px; margin-top:3px; }

  /* ---------- Home ---------- */
  .hero{ margin-bottom:26px; }
  .hero .eyebrow{ color:var(--volt); font-size:12px; letter-spacing:2px; font-weight:700; text-transform:uppercase; margin-bottom:8px; }
  .hero h1{ font-size:38px; line-height:0.95; margin:0 0 6px; }
  .hero p{ color:var(--text-muted); font-size:14px; margin:0; max-width:32ch; }

  .prog-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
    cursor:pointer;
    overflow:hidden;
    transition: border-color .15s, transform .1s;
  }
  .prog-card:active{ transform: scale(0.985); }
  .prog-card:hover{ border-color:var(--line-strong); }
  .prog-card .tag{ font-size:11px; letter-spacing:1.5px; color:var(--text-dim); text-transform:uppercase; font-weight:700; }
  .prog-card h2{ font-size:26px; margin:4px 0 6px; }
  .prog-card .meta{ color:var(--text-muted); font-size:13px; }
  .prog-card .plate{
    position:absolute; right:-18px; top:50%; transform:translateY(-50%);
    width:88px; height:88px; border-radius:50%;
    border:10px solid rgba(255,255,255,0.05);
    display:flex; align-items:center; justify-content:center;
  }
  .prog-card .plate .num{ font-family:'Anton'; font-size:26px; color:rgba(255,255,255,0.08); }
  .prog-card.fullbody .plate{ border-color: rgba(198,255,61,0.10); }
  .prog-card.ppl .plate{ border-color: rgba(255,90,54,0.10); }
  .prog-card.split .plate{ border-color: rgba(77,168,218,0.10); }
  .prog-card .arrow{ position:absolute; right:18px; bottom:16px; color:var(--text-dim); font-size:18px; }

  .history-entry-btn{
    display:flex; align-items:center; justify-content:space-between;
    background:transparent; border:1px dashed var(--line-strong); border-radius:var(--radius);
    padding:16px 18px; margin-top:20px; color:var(--text-muted); cursor:pointer; font-size:14px; font-weight:600;
  }
  .history-entry-btn:active{ background:var(--surface); }

  /* ---------- Week view ---------- */
  .day-card-wrap{ margin-bottom:12px; border-radius:var(--radius); overflow:hidden; }
  .day-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--line);
    padding:16px 18px; cursor:pointer;
  }
  .day-card:active{ background:var(--surface-2); }
  .day-card .daynum{
    width:46px; height:46px; border-radius:12px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Anton'; font-size:12px; color:var(--volt); text-transform:uppercase; text-align:center; line-height:1.1;
  }
  .day-card .info h3{ margin:0 0 3px; font-size:17px; }
  .day-card .info span{ color:var(--text-muted); font-size:12.5px; }
  .day-card .chev{ margin-left:auto; color:var(--text-dim); }
  .repeat-row{
    display:flex; align-items:center; gap:7px; background:var(--volt-dim); border:1px solid rgba(198,255,61,0.25); border-top:none;
    padding:9px 18px; font-size:11.5px; font-weight:700; color:var(--volt); cursor:pointer;
  }
  .repeat-row svg{ width:13px; height:13px; flex-shrink:0; }
  .repeat-row:active{ background:rgba(198,255,61,0.22); }
  .repeat-row .repeat-count{ color:var(--text-dim); font-weight:600; margin-left:auto; }

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:12px; padding:14px 18px; font-family:'Inter'; font-weight:700;
    font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background:var(--volt); color:#10130a; }
  .btn-primary:active{ opacity:0.85; }
  .btn-primary:disabled{ background:var(--surface-2); color:var(--text-dim); }
  .btn-ember{ background:var(--ember); color:#1a0a05; }
  .btn-steel{ background:var(--steel); color:#06141c; }
  .btn-ghost{ background:var(--surface); color:var(--text); border:1px solid var(--line); }
  .btn-ghost:active{ background:var(--surface-2); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 14px; font-size:13px; border-radius:10px; }

  /* ---------- Session ---------- */
  .progress-strip{ display:flex; gap:5px; margin-bottom:16px; }
  .progress-strip .seg{ flex:1; height:4px; border-radius:2px; background:var(--surface-2); }
  .progress-strip .seg.done{ background:var(--volt); }
  .progress-strip .seg.current{ background:var(--steel); }

  .exercise-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px;
  }
  .exercise-card .muscle-badge{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:var(--volt); background:var(--volt-dim); padding:5px 10px; border-radius:20px; margin-bottom:10px;
  }
  .exercise-card h2{ font-size:24px; margin:0 0 12px; line-height:1.05; }

  .variant-select{
    width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-family:'Inter'; font-size:13.5px; font-weight:600;
    margin-bottom:12px; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%238b8e92' stroke-width='1.5'/></svg>");
    background-repeat:no-repeat; background-position: right 14px center;
  }

  .config-row{ display:flex; gap:10px; margin-bottom:16px; }
  .config-chip{
    flex:1; text-align:center; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 6px; cursor:pointer; font-size:12.5px; color:var(--text-muted); font-weight:600;
  }
  .config-chip .val{ display:block; font-family:'JetBrains Mono'; font-size:16px; color:var(--text); font-weight:700; margin-bottom:2px;}
  .config-chip.active{ border-color:var(--volt); background:var(--volt-dim); color:var(--volt); }
  .config-chip.active .val{ color:var(--volt); }

  .set-row{
    display:grid; grid-template-columns: 30px 1fr 1fr 44px; gap:8px; align-items:center;
    padding:9px 0; border-top:1px solid var(--line);
  }
  .set-row:first-of-type{ border-top:none; }
  .set-row .set-idx{ font-family:'JetBrains Mono'; font-size:13px; color:var(--text-dim); font-weight:600; }
  .set-row input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding:9px 8px; color:var(--text); font-family:'JetBrains Mono'; font-size:14px; font-weight:600; text-align:center;
  }
  .set-row input::placeholder{ color:var(--text-dim); font-weight:500; }
  .set-row input:disabled{ opacity:0.5; }
  .set-row .validate{
    width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
  }
  .set-row .validate.done{ background:var(--volt); border-color:var(--volt); color:#10130a; }
  .set-labels{ display:grid; grid-template-columns: 30px 1fr 1fr 44px; gap:8px; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-top:14px; margin-bottom:2px;}

  .rest-inline{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .rest-inline label{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .rest-select{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:'JetBrains Mono'; font-size:13px; font-weight:600; }

  .exercise-nav{ display:flex; gap:10px; margin-bottom:14px; }
  .exercise-nav .btn{ flex:1; }

  /* ---------- Rest timer overlay ---------- */
  .rest-overlay{
    position:absolute; inset:0; background:rgba(10,11,12,0.88); backdrop-filter: blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50;
    padding:24px;
  }
  .rest-overlay .label{ color:var(--steel); font-size:12px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:18px; }
  .timer-ring-wrap{ position:relative; width:230px; height:230px; margin-bottom:26px; }
  .timer-ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring-wrap .track{ fill:none; stroke:var(--surface-2); stroke-width:10; }
  .timer-ring-wrap .fill{ fill:none; stroke:var(--steel); stroke-width:10; stroke-linecap:round; transition: stroke-dashoffset 1s linear; }
  .timer-ring-wrap .digits{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono'; font-size:48px; font-weight:700; color:var(--text);
  }
  .rest-controls{ display:flex; gap:10px; width:100%; max-width:280px; }
  .rest-skip{ margin-top:18px; color:var(--text-muted); font-size:13px; background:none; border:none; text-decoration:underline; cursor:pointer; }

  /* ---------- Suppression / gestion d'exercices ---------- */
  .manage-btn{ margin-left:auto; }
  .remove-x{
    width:30px; height:30px; border-radius:50%; background:var(--ember-dim); color:var(--ember);
    border:1px solid rgba(255,90,54,0.25); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .remove-x:active{ background:var(--ember); color:#1a0a05; }

  .manager-overlay{ align-items:stretch; justify-content:flex-end; padding:0; }
  .manager-panel{
    width:100%; max-height:82vh; background:var(--bg-2); border-top:1px solid var(--line-strong);
    border-radius:22px 22px 0 0; padding:20px 20px calc(20px + var(--safe-bottom));
    display:flex; flex-direction:column; gap:14px;
  }
  .manager-head{ display:flex; align-items:center; justify-content:space-between; }
  .manager-head h3{ font-size:19px; margin:0; }
  .manager-list{ overflow-y:auto; max-height:38vh; display:flex; flex-direction:column; gap:8px; }
  .manager-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .manager-row h4{ margin:0 0 2px; font-size:14.5px; }
  .manager-row span{ color:var(--text-muted); font-size:12px; }

  .picker-wrap{ display:flex; flex-direction:column; gap:10px; max-height:50vh; }
  .picker-back{ color:var(--steel); font-size:13px; font-weight:700; cursor:pointer; padding:4px 0; }
  .picker-scroll{ overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-right:2px; }
  .picker-group-title{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); font-weight:700; margin-bottom:6px; }
  .picker-item{
    display:flex; align-items:center; justify-content:space-between; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-bottom:6px; cursor:pointer; font-size:13.5px;
  }
  .picker-item:active{ background:var(--surface-2); }
  .add-plus{ color:var(--volt); }

  /* ---------- Modale de confirmation ---------- */
  .confirm-overlay{ padding:24px; }
  .confirm-box{
    width:100%; max-width:320px; background:var(--surface); border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:24px 20px 20px;
  }
  .confirm-box p{ margin:0 0 20px; font-size:14.5px; line-height:1.5; text-align:center; }
  .confirm-actions{ display:flex; gap:10px; }

  /* ---------- Sticky end-session bar ---------- */
  .end-bar{
    position:sticky; bottom:calc(80px + var(--safe-bottom)); z-index:10; margin-top:6px;
  }

  /* ---------- Summary ---------- */
  .summary-hero{ text-align:center; padding: 30px 0 10px; }
  .summary-hero .check{
    width:64px; height:64px; border-radius:50%; background:var(--volt-dim); border:2px solid var(--volt);
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; color:var(--volt);
  }
  .summary-hero h1{ font-size:28px; margin:0 0 6px; }
  .summary-hero p{ color:var(--text-muted); font-size:14px; margin:0; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:26px 0; }
  .stat-box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 8px; text-align:center; }
  .stat-box .n{ font-family:'JetBrains Mono'; font-size:22px; font-weight:700; color:var(--volt); }
  .stat-box .l{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }
  .chart-wrap{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 14px; height:260px; margin-bottom:16px;
  }
  .summary-list{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6px 18px; margin-bottom:20px; }
  .summary-list .ex-row{ padding:13px 0; border-top:1px solid var(--line); }
  .summary-list .ex-row:first-child{ border-top:none; }
  .summary-list .ex-row h4{ margin:0 0 4px; font-size:14.5px; }
  .summary-list .ex-row .sets-line{ color:var(--text-muted); font-size:12.5px; font-family:'JetBrains Mono'; }

  /* ---------- History ---------- */
  .hist-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .hist-card:active{ background:var(--surface-2); }
  .hist-card .date{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; font-weight:700; margin-bottom:5px; }
  .hist-card h3{ margin:0 0 4px; font-size:16.5px; }
  .hist-card .meta{ color:var(--text-muted); font-size:12.5px; }
  .hist-card .dur{ font-family:'JetBrains Mono'; font-size:15px; color:var(--steel); font-weight:700; text-align:right; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .icon{ margin-bottom:14px; color:var(--text-dim); }
  .empty-state p{ font-size:14px; max-width:26ch; margin:0 auto; }

  /* ---------- Profil ---------- */
  .profile-hero{ text-align:center; padding:20px 0 30px; }
  .profile-hero .avatar{
    width:72px; height:72px; border-radius:50%; margin:0 auto 14px;
    background:linear-gradient(135deg, var(--volt), var(--steel)); display:flex; align-items:center; justify-content:center;
    font-family:'Anton'; font-size:26px; color:#10130a;
  }
  .profile-hero h1{ font-size:22px; margin:0 0 4px; }
  .profile-hero p{ color:var(--text-muted); font-size:13px; margin:0; }
  .settings-block{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4px 18px; margin-bottom:16px; }
  .settings-row{ display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-top:1px solid var(--line); }
  .settings-row:first-child{ border-top:none; }
  .settings-row .k{ font-size:14px; font-weight:600; }
  .settings-row .v{ font-family:'JetBrains Mono'; color:var(--volt); font-weight:700; }
  .danger-btn{ width:100%; background:none; border:1px solid var(--ember); color:var(--ember); border-radius:12px; padding:13px; font-weight:700; font-size:13.5px; cursor:pointer; }

  /* ---------- Bottom nav ---------- */
  #bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:rgba(21,22,23,0.92); backdrop-filter: blur(14px);
    border-top:1px solid var(--line); display:flex; padding: 8px 6px calc(8px + var(--safe-bottom));
    z-index:40;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px;
    color:var(--text-dim); cursor:pointer; border:none; background:none; font-family:'Inter'; font-size:8.8px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.2px; min-width:0;
  }
  .nav-item svg{ width:18px; height:18px; }
  .nav-item.active{ color:var(--volt); }
  .nav-item:disabled{ opacity:0.3; }
  .nav-item .dot{ position:relative; }
  .nav-item .pulse{ position:absolute; top:-2px; right:-4px; width:6px; height:6px; border-radius:50%; background:var(--ember); }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:100;
    background:var(--surface-2); border:1px solid var(--line-strong); padding:11px 18px; border-radius:10px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* ---------- Cartes catégories (accueil / cardio) ---------- */
  .cat-card{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; cursor:pointer; border-left:3px solid transparent;
  }
  .cat-card:active{ background:var(--surface-2); }
  .cat-card.cat-volt{ border-left-color:var(--volt); }
  .cat-card.cat-steel{ border-left-color:var(--steel); }
  .cat-card.cat-kb{ border-left-color:var(--kb); }
  .cat-card.cat-violet{ border-left-color:var(--violet); }
  .cat-icon{ width:42px; height:42px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text); }
  .cat-card h3{ margin:0 0 2px; font-size:16px; }
  .cat-card span{ color:var(--text-muted); font-size:12.5px; }
  .cat-chev{ margin-left:auto; color:var(--text-dim); }

  .prog-card.kettlebell_fullbody .plate{ border-color: rgba(232,182,76,0.10); }

  .last-session-card{
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--radius);
    padding:16px 18px; margin:18px 0 4px; cursor:pointer;
  }
  .last-session-card .tag{ font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); font-weight:700; }
  .last-session-card h3{ margin:6px 0 4px; font-size:15.5px; }
  .last-session-card .meta{ color:var(--text-muted); font-size:12.5px; }

  .next-card{
    background:var(--volt-dim); border:1px solid rgba(198,255,61,0.3); border-radius:var(--radius);
    padding:16px 18px; margin:18px 0 4px; cursor:pointer;
  }
  .next-card:active{ background:rgba(198,255,61,0.2); }
  .next-card .tag{
    display:flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--volt); font-weight:800;
  }
  .next-card .tag svg{ width:13px; height:13px; }
  .next-card h3{ margin:8px 0 4px; font-size:18px; }
  .next-card span{ color:var(--text-muted); font-size:12.5px; }

  .mini-hist-list{ margin-bottom:6px; }
  .mini-hist-row{ display:flex; align-items:center; gap:9px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .mini-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .mini-title{ font-size:13px; font-weight:600; flex:1; }
  .mini-date{ font-size:11.5px; color:var(--text-dim); }

  /* ---------- Formulaires (course / fractionné) ---------- */
  .field-label{ display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:7px; }
  .field-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--text); font-family:'Inter'; font-size:14.5px; font-weight:600; resize:vertical;
  }
  .field-select{ width:100%; }
  .time-input-row{ display:flex; gap:10px; }
  .time-input-row > div{ flex:1; position:relative; }
  .time-input-row span{ position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:12px; pointer-events:none; }
  .course-preview{
    display:flex; justify-content:space-around; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono'; font-size:19px; font-weight:700; color:var(--steel);
  }
  .course-preview small{ font-size:11px; color:var(--text-muted); font-weight:500; }
  .course-preview .dim{ font-family:'Inter'; font-size:12.5px; color:var(--text-dim); font-weight:500; }

  .fract-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .fract-head h3{ margin:0 0 6px; font-size:16px; }
  .fract-structure{ font-family:'JetBrains Mono'; font-size:12.5px; color:var(--violet); margin-bottom:12px; }
  .fract-actions{ display:flex; gap:8px; }
  .fract-actions .btn-primary{ flex:1; }

  .segment-form{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; }

  /* ---------- Historique : filtres + toggle vue ---------- */
  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
  .filter-chip{
    flex-shrink:0; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{ background:var(--volt-dim); border-color:var(--volt); color:var(--volt); }
  .view-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .vt-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; color:var(--text-muted);
    font-family:'Inter'; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .vt-btn.active{ background:var(--surface-2); color:var(--text); border-color:var(--line-strong); }
  .cat-tag{ display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; padding:2px 7px; border-radius:6px; margin-right:6px; }

  /* ---------- Calendrier ---------- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:var(--text-dim); font-size:11px; font-weight:700; margin-bottom:6px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:8px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; cursor:default;
  }
  .cal-cell.has-session{ cursor:pointer; }
  .cal-daynum{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:600; color:var(--text-muted); transition: transform .1s;
  }
  .cal-cell.has-session .cal-daynum{ color:#10130a; font-weight:800; }
  .cal-cell.has-session:active .cal-daynum{ transform: scale(0.9); }
  .cal-cell.selected .cal-daynum{ outline:2px solid var(--text); outline-offset:2px; }
  .cal-cell.today:not(.has-session) .cal-daynum{ color:var(--volt); outline:1.5px solid var(--volt); }
  .cal-selected-list{ margin-top:14px; }

  /* ---------- Chronomètre de fractionné ---------- */
  .runner-wrap{
    display:flex; flex-direction:column; align-items:center; padding:30px 20px; border-radius:var(--radius);
    margin-bottom:18px; background:var(--surface); border:1px solid var(--line); transition: background .3s, border-color .3s;
  }
  .runner-wrap.kind-effort{ background:var(--ember-dim); border-color:rgba(255,90,54,0.3); }
  .runner-wrap.kind-recovery{ background:var(--steel-dim); border-color:rgba(77,168,218,0.3); }
  .runner-wrap.kind-simple{ background:var(--volt-dim); border-color:rgba(198,255,61,0.3); }
  .runner-phase-label{ font-size:13px; letter-spacing:3px; text-transform:uppercase; font-weight:800; margin-bottom:14px; }
  .runner-phase-label.kind-effort{ color:var(--ember); }
  .runner-phase-label.kind-recovery{ color:var(--steel); }
  .runner-phase-label.kind-simple{ color:var(--volt); }
  .runner-digits{ font-family:'JetBrains Mono'; font-size:58px; font-weight:700; color:var(--text); line-height:1; margin-bottom:18px; }
  .runner-bar{ width:100%; height:8px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden; margin-bottom:12px; }
  .runner-bar-fill{ height:100%; background:currentColor; color:var(--text); border-radius:4px; transition: width 1s linear; }
  .runner-wrap.kind-effort .runner-bar-fill{ color:var(--ember); }
  .runner-wrap.kind-recovery .runner-bar-fill{ color:var(--steel); }
  .runner-wrap.kind-simple .runner-bar-fill{ color:var(--volt); }
  .runner-next{ color:var(--text-muted); font-size:12.5px; }

  /* ---------- Chrono de durée de séance (topbar) ---------- */
  .session-clock{
    font-size:13px; font-weight:700; color:var(--volt); background:var(--volt-dim);
    padding:6px 10px; border-radius:8px; margin-left:auto; flex-shrink:0;
  }

  /* ---------- Lien "Annuler la séance" ---------- */
  .cancel-link{
    display:block; width:100%; text-align:center; background:none; border:none;
    color:var(--text-dim); font-size:12.5px; font-weight:600; text-decoration:underline;
    padding:12px 0 4px; cursor:pointer;
  }
  .cancel-link:active{ color:var(--ember); }

  /* ---------- Navigation de période (graphique de progression) ---------- */
  .period-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; }
  .period-nav .period-label{ font-family:'JetBrains Mono'; font-size:13px; font-weight:700; color:var(--text); text-transform:capitalize; min-width:150px; text-align:center; }

  /* ---------- Export / Import ---------- */
  .export-block{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .export-block h4{ margin:0 0 8px; font-size:14.5px; }

  .storage-warning{
    background:var(--ember-dim); border:1px solid rgba(255,90,54,0.3); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:16px;
  }
  .storage-warning strong{ color:var(--ember); font-size:13.5px; }
  .storage-warning p{ margin:8px 0 0; color:var(--text-muted); font-size:12.5px; line-height:1.5; }
  .storage-warning code{ background:var(--surface-2); padding:1px 5px; border-radius:4px; font-family:'JetBrains Mono'; font-size:11.5px; }
  .export-block p{ margin:0 0 14px; color:var(--text-muted); font-size:12.5px; line-height:1.5; }
  .export-actions{ display:flex; gap:10px; }
  .export-actions .btn{ flex:1; font-size:13px; }

  /* ---------- Étirements ---------- */
  .stretch-list{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4px 18px; }
  .stretch-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); gap:10px; }
  .stretch-row:first-child{ border-top:none; }
  .stretch-row h4{ margin:0 0 3px; font-size:14.5px; }
  .stretch-row span{ color:var(--text-muted); font-size:12px; }
  .stretch-row .side-tag{ font-size:10px; color:var(--violet); background:var(--violet-dim); padding:2px 6px; border-radius:5px; margin-left:4px; font-weight:700; }
  .stretch-dur{ font-family:'JetBrains Mono'; color:var(--text-dim) !important; font-size:12.5px !important; flex-shrink:0; }

/* ============================= STOCKAGE ============================= */
/* Utilise le stockage persistant de Claude quand disponible (aperçu dans Claude.ai) ;
   bascule automatiquement sur localStorage sinon (application autonome sur iPhone, etc.) */
const HAS_CLAUDE_STORAGE = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
let storageBroken = false;
let storageWarningShown = false;

/* Teste la disponibilité réelle du stockage une seule fois au démarrage, pour donner un
   diagnostic clair plutôt que de répéter "Erreur de sauvegarde" à chaque action. Le stockage
   peut être bloqué par le navigateur quand la page est ouverte comme fichier local (file://)
   ou en navigation privée : dans ce cas l'app continue de fonctionner normalement, mais les
   données ne seront conservées que pour la session en cours. */
async function checkStorageAvailability(){
  try{
    if(HAS_CLAUDE_STORAGE){
      await window.storage.set("__forge_test__", "1", false);
      await window.storage.get("__forge_test__", false);
    } else {
      localStorage.setItem("__forge_test__", "1");
      localStorage.getItem("__forge_test__");
      localStorage.removeItem("__forge_test__");
    }
    storageBroken = false;
  } catch(e){
    storageBroken = true;
    console.error("Stockage indisponible :", e);
  }
}
function warnStorageBrokenOnce(){
  if(storageWarningShown) return;
  storageWarningShown = true;
  showToast("⚠️ Sauvegarde indisponible ici — tes données ne seront pas conservées après fermeture");
}
async function safeGet(key){
  try{
    if(HAS_CLAUDE_STORAGE){
      const r = await window.storage.get(key,false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
async function safeSet(key,val){
  if(storageBroken){ warnStorageBrokenOnce(); return; }
  try{
    if(HAS_CLAUDE_STORAGE){ await window.storage.set(key, JSON.stringify(val), false); }
    else{ localStorage.setItem(key, JSON.stringify(val)); }
  } catch(e){
    console.error("Erreur de sauvegarde",e);
    storageBroken = true;
    warnStorageBrokenOnce();
  }
}
async function loadAll(){
  const [hist, prefs, intervals, stretchCircuits] = await Promise.all([
    safeGet("history"), safeGet("prefs"), safeGet("interval_programs"), safeGet("stretch_circuits")
  ]);

  state.prefs = prefs || { variants:{}, seriesCount:{} };
  state.stretchCircuits = stretchCircuits || JSON.parse(JSON.stringify(STRETCH_CIRCUITS_DEFAULT));
  if(intervals){
    state.intervalPrograms = intervals;
  } else {
    // Séance d'exemple à la première utilisation
    state.intervalPrograms = [{
      id:"interval_default",
      name:"30/30",
      segments:[
        { id:"seg1", type:"simple", name:"Échauffement", duration:600 },
        { id:"seg2", type:"interval", name:"Fractionné", effortDuration:30, recoveryDuration:30, reps:10 },
        { id:"seg3", type:"simple", name:"Retour au calme", duration:300 },
      ],
    }];
    await persistIntervalPrograms();
  }
  state.storageReady = true;
}
async function persistHistory(){ await safeSet("history", state.historyList); }
async function persistPrefs(){ await safeSet("prefs", state.prefs); }
async function persistIntervalPrograms(){ await safeSet("interval_programs", state.intervalPrograms); }

/* Les séances enregistrées avant l'ajout du module Cardio/Kettlebell n'ont pas de champ "type".
   On le déduit rétroactivement pour éviter toute erreur d'affichage dans l'historique. */
function migrateHistory(list){
  let changed = false;
  const fixed = list.map(rec=>{
    if(rec.type) return rec;
    changed = true;
    let type = "musculation";
    if(rec.programKey && STRENGTH_PROGRAMS[rec.programKey]){
      type = STRENGTH_PROGRAMS[rec.programKey].category;
    } else if(rec.distanceKm!==undefined){
      type = "course";
    } else if(rec.structureSummary!==undefined){
      type = "fractionne";
    }
    return { ...rec, type };
  });
  if(changed) safeSet("history", fixed);
  return fixed;
}

/* ============================= UTILITAIRES ============================= */
function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,"0");
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function fmtDuration(ms){
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h>0 ? `${h}h${m.toString().padStart(2,"0")}` : `${m} min`;
}
function fmtClock(totalSec){
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60).toString().padStart(2,"0");
  const s = Math.floor(totalSec%60).toString().padStart(2,"0");
  return h>0 ? `${h}:${m}:${s}` : `${m}:${s}`;
}
/* Chrono live affiché pendant une séance de musculation/kettlebell — calculé à partir
   de l'heure réelle de départ, donc toujours exact même après un passage en arrière-plan. */
let sessionClockInterval = null;
function startSessionClock(){
  if(sessionClockInterval || !state.activeSession) return;
  updateSessionClockDOM();
  sessionClockInterval = setInterval(updateSessionClockDOM, 1000);
}
function stopSessionClock(){
  clearInterval(sessionClockInterval);
  sessionClockInterval = null;
}
function updateSessionClockDOM(){
  const el = document.getElementById("session-clock");
  if(!el || !state.activeSession){ stopSessionClock(); return; }
  el.textContent = fmtClock(Math.floor((Date.now()-state.activeSession.startedAt)/1000));
}
/* Échappe le texte saisi librement par l'utilisateur (notes, noms de séances de fractionné…)
   avant de l'insérer dans le HTML, pour éviter qu'un guillemet ou un caractère spécial ne casse l'affichage. */
function escapeHtml(str){
  return String(str==null ? "" : str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDateFR(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
}
function fmtPace(minPerKm){
  const m = Math.floor(minPerKm);
  const s = Math.round((minPerKm-m)*60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function fmtSegDuration(sec){
  if(sec>=60 && sec%60===0) return `${sec/60}min`;
  if(sec>=60) return `${Math.floor(sec/60)}min${(sec%60).toString().padStart(2,"0")}`;
  return `${sec}s`;
}
/* Titre / méta-ligne génériques pour une carte d'historique, quel que soit le type */
function histCardTitle(rec){
  if(rec.type==="musculation" || rec.type==="kettlebell") return `${rec.programName} — ${rec.label}`;
  if(rec.type==="course") return `Course — ${rec.distanceKm} km`;
  if(rec.type==="fractionne") return escapeHtml(rec.programName);
  return "Séance";
}
function histCardMeta(rec){
  if(rec.type==="musculation" || rec.type==="kettlebell") return `${rec.exercises.length} exercices · ${rec.totalSets} séries`;
  if(rec.type==="course") return `${fmtPace(rec.paceMinPerKm)} min/km · ${rec.speedKmH.toFixed(1)} km/h`;
  if(rec.type==="fractionne") return `${rec.intervalsCount} intervalles · ${rec.structureSummary}`;
  return "";
}
function histCardDuration(rec){
  if(rec.type==="course") return fmtTime(rec.durationSec);
  return fmtDuration(rec.durationMs);
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============================= ALERTES (son / vibration / notification) ============================= */
/* Le son des chronos (gentleBell, beep, warnTick) ne joue plus qu'au moment précis où
   il doit sonner — jamais en continu. En complément :
   - Vibration du téléphone si le navigateur le permet (Android notamment).
   - Notification système si l'app est en arrière-plan (PWA ajoutée à l'écran d'accueil,
     iOS 16.4+).
   Limites honnêtes : impossible de couper le son d'une autre appli (Spotify, Musique...)
   depuis un site web. Et si le téléphone est verrouillé ou l'app vraiment en arrière-plan,
   iOS peut retarder ou empêcher le son de jouer au moment exact — la notification prend
   alors le relais dès que possible. */
function vibrate(pattern){
  try{ if("vibrate" in navigator) navigator.vibrate(pattern); }catch(e){}
}
function requestNotifPermission(){
  try{
    if("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
  }catch(e){}
}
function notifyBackground(title, body){
  try{
    if(document.hidden && "Notification" in window && Notification.permission === "granted"){
      new Notification(title, { body, silent:false });
    }
  }catch(e){}
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach((delay,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type="sine"; o.frequency.value = i===2 ? 1046 : 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+delay+0.16);
      o.start(ctx.currentTime+delay); o.stop(ctx.currentTime+delay+0.18);
    });
  }catch(e){}
}
/* Sonnette douce — utilisée à la fin du temps de repos en musculation */
function gentleBell(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const fundamental = 587.33; // ré5, timbre chaud
    [1, 2, 2.76].forEach((mult,i)=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = i===0 ? "sine" : "triangle";
      o.frequency.value = fundamental*mult;
      o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime;
      const peak = i===0 ? 0.22 : 0.07;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+1.3);
      o.start(t0); o.stop(t0+1.35);
    });
  }catch(e){}
}
/* Annonce vocale des phases du fractionné ("Effort" / "Repos" / nom de l'étape) */
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* Petit bip discret 3 secondes avant la fin d'un intervalle (effort ou récupération) */
function warnTick(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 660;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.12);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+0.15);
  }catch(e){}
}
function announcePhase(phase){
  if(phase.kind==="effort") speak("Effort");
  else if(phase.kind==="recovery") speak("Repos");
  else speak(phase.label);
}

/* ============================= SESSION LOGIC ============================= */
function buildSession(programKey, dayIndex){
  const prog = STRENGTH_PROGRAMS[programKey];
  const day = prog.days[dayIndex];
  const exercises = day.exercises.map(id=>{
    const base = EXERCISE_DB[id];
    const variant = state.prefs.variants[id] || base.name;
    const seriesCount = state.prefs.seriesCount[id] || base.sets;
    return {
      id, muscle: base.muscle, variants: base.variants, repsHint: base.reps,
      name: variant, seriesCount,
      restTime: base.rest,
      sets: Array.from({length:seriesCount}, ()=>({weight:"", reps:"", done:false})),
    };
  });
  return {
    programKey, dayIndex, programName: prog.name, category: prog.category, day: day.day, label: day.label,
    startedAt: Date.now(), currentIndex:0, exercises,
  };
}

function currentExercise(){
  const s = state.activeSession;
  return s.exercises[s.currentIndex];
}

async function endSession(){
  const s = state.activeSession;
  const durationMs = Date.now() - s.startedAt;
  let totalSets = 0;
  s.exercises.forEach(ex=> totalSets += ex.sets.filter(x=>x.done).length );
  const record = {
    id: "sess_"+Date.now(),
    type: s.category,
    date: new Date().toISOString(),
    programKey: s.programKey, dayIndex: s.dayIndex, programName: s.programName,
    day: s.day, label: s.label,
    durationMs, totalSets,
    exercises: s.exercises.map(ex=>({
      name: ex.name, muscle: ex.muscle,
      sets: ex.sets.filter(x=>x.done).map(x=>({weight:x.weight||"—", reps:x.reps||"—"})),
    })).filter(ex=>ex.sets.length>0),
    /* Composition exacte de la séance (exercices ajoutés/supprimés, variantes, séries choisies)
       — utilisée pour proposer de reprendre exactement la même séance plus tard. */
    composition: s.exercises.map(ex=>({
      id: ex.id, name: ex.name, muscle: ex.muscle, variants: ex.variants,
      repsHint: ex.repsHint, seriesCount: ex.seriesCount, restTime: ex.restTime,
    })),
  };
  state.historyList.unshift(record);
  await persistHistory();
  state.historyDetail = record;
  state.activeSession = null;
  state.view = "historyDetail";
  stopTimer();
  render();
}

/* ============================= TIMER (repos musculation) ============================= */
/* Le décompte est calculé à partir d'une horloge réelle (endAt) plutôt que d'un compteur
   décrémenté à chaque tick : le chrono reste donc exact même si l'app est mise en arrière-plan
   (le système ralentit ou suspend les timers JS, mais l'heure réelle, elle, ne s'arrête jamais). */
function startTimer(exerciseId, seconds){
  stopTimer();
  state.timer = { total:seconds, remaining:seconds, running:true, intervalId:null, exerciseId, endAt: Date.now()+seconds*1000 };
  tickTimer();
  state.timer.intervalId = setInterval(tickTimer, 1000);
  render();
}
function tickTimer(){
  const t = state.timer;
  if(!t.running) return;
  t.remaining = Math.max(0, Math.ceil((t.endAt - Date.now())/1000));
  updateTimerDOM();
  if(t.remaining<=0){
    stopTimer(true);
    gentleBell();
    vibrate([200,100,200]);
    showToast("Repos terminé — c'est reparti !");
    notifyBackground("Repos terminé", "C'est reparti pour la série suivante 💪");
  }
}
function toggleTimerPause(){
  const t = state.timer;
  if(t.running){
    t.remaining = Math.max(0, Math.ceil((t.endAt-Date.now())/1000));
    t.running = false;
  } else {
    t.endAt = Date.now() + t.remaining*1000;
    t.running = true;
  }
  render();
}
function resetTimer(){
  const t = state.timer;
  t.remaining = t.total;
  t.endAt = Date.now() + t.total*1000;
  render();
}
function stopTimer(keepOverlayClosed){
  clearInterval(state.timer.intervalId);
  state.timer.intervalId = null;
  state.timer.running = false;
  if(keepOverlayClosed){ state.timer.exerciseId = null; }
}
function closeTimer(){
  stopTimer();
  state.timer.exerciseId = null;
  render();
}
function updateTimerDOM(){
  const t = state.timer;
  const digits = document.getElementById("timer-digits");
  const ring = document.getElementById("timer-ring-fill");
  if(!digits || !ring) return;
  digits.textContent = fmtTime(Math.max(0,t.remaining));
  const circumference = 2*Math.PI*100;
  const pct = t.total>0 ? t.remaining/t.total : 0;
  ring.style.strokeDashoffset = circumference * (1-pct);
}

/* Dernière séance réellement faite pour un jour précis d'un programme (ex. "Push" du PPL) */
function lastSessionForDay(programKey, dayIndex){
  return state.historyList.find(r=>
    r.programKey===programKey && r.dayIndex===dayIndex && Array.isArray(r.composition)
  );
}

/* Reconstruit une séance à partir de la composition réellement utilisée la dernière fois
   (exercices ajoutés/supprimés, variantes et nombre de séries choisis), avec des séries vierges. */
function buildSessionFromRecord(record){
  const exercises = record.composition.map(c=>({
    id: c.id, muscle: c.muscle, variants: c.variants, repsHint: c.repsHint,
    name: c.name, seriesCount: c.seriesCount, restTime: c.restTime,
    sets: Array.from({length:c.seriesCount}, ()=>({weight:"", reps:"", done:false})),
  }));
  return {
    programKey: record.programKey, dayIndex: record.dayIndex, programName: record.programName,
    category: record.type, day: record.day, label: record.label,
    startedAt: Date.now(), currentIndex:0, exercises,
  };
}

function repeatDaySession(programKey, dayIndex, parentCategory){
  const record = lastSessionForDay(programKey, dayIndex);
  state.programKey = programKey;
  state.weekParent = parentCategory;
  if(!record){ startDay(programKey, dayIndex); return; }
  state.activeSession = buildSessionFromRecord(record);
  state.view = "session";
  showToast("Séance reprise telle que la dernière fois");
  render();
}

function leaveSession(){ state.view = state.weekParent || "home"; render(); }

function openHistoryDetail(record){
  state.historyDetail = record;
  state.view = "historyDetail";
  render();
}

/* ============================= ACTIONS SÉANCE ============================= */
function setVariant(exIndex, variantName){
  const ex = state.activeSession.exercises[exIndex];
  ex.name = variantName;
  state.prefs.variants[ex.id] = variantName;
  persistPrefs();

function setSeriesCount(exIndex, count){
  const ex = state.activeSession.exercises[exIndex];
  if(ex.seriesCount === count) return;
  ex.seriesCount = count;
  state.prefs.seriesCount[ex.id] = count;
  persistPrefs();
  const cur = ex.sets.length;
  if(count > cur){
    for(let i=cur;i<count;i++) ex.sets.push({weight:"", reps:"", done:false});
  } else {
    ex.sets = ex.sets.slice(0,count);
  }
  render();

/* ============================= EXPORT / IMPORT DES DONNÉES ============================= */
function exportData(){
  const payload = {
    app: "forge-coach-sportif",
    exportedAt: new Date().toISOString(),
    history: state.historyList,
    prefs: state.prefs,
    intervalPrograms: state.intervalPrograms,
    stretchCircuits: state.stretchCircuits,
  };
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `forge-export-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast("Export téléchargé");
  }catch(e){
    console.error(e);
    showToast("Erreur lors de l'export");
  }
}
function triggerImportPicker(){
  document.getElementById("import-file-input").click();
}
function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast("Fichier invalide — impossible de le lire"); inputEl.value=""; return; }
    if(!parsed || (!parsed.history && !parsed.prefs && !parsed.intervalPrograms)){
      showToast("Ce fichier ne contient pas de données Forge reconnues");
      inputEl.value = "";
      return;
    }
    state.pendingImport = parsed;
    const n = Array.isArray(parsed.history) ? parsed.history.length : 0;
    askConfirm(`Importer ${n} séance(s) ? Cela remplacera toutes tes données actuelles dans cette version.`, applyImport);
    inputEl.value = "";
  };
  reader.onerror = ()=>{ showToast("Erreur de lecture du fichier"); inputEl.value=""; };
  reader.readAsText(file);
}
async function applyImport(){
  const parsed = state.pendingImport;
  if(!parsed) return;
  state.historyList = migrateHistory(Array.isArray(parsed.history) ? parsed.history : []);
  state.prefs = parsed.prefs || { variants:{}, seriesCount:{} };
  state.intervalPrograms = Array.isArray(parsed.intervalPrograms) ? parsed.intervalPrograms : [];
  state.stretchCircuits = parsed.stretchCircuits || JSON.parse(JSON.stringify(STRETCH_CIRCUITS_DEFAULT));
  state.pendingImport = null;
  await persistHistory();
  await persistPrefs();
  await persistIntervalPrograms();
  await persistStretchCircuits();
  showToast("Données importées !");
  goHome();
}

async function doResetAllData(){
  if(state.cardioRunner && state.cardioRunner.intervalId) clearInterval(state.cardioRunner.intervalId);
  if(state.stretchRunner && state.stretchRunner.intervalId) clearInterval(state.stretchRunner.intervalId);

  state.historyList = [];
  state.prefs = { variants:{}, seriesCount:{} };

  state.cardioRunner = null;

function updateCoursePreview(){

    const speedKmH = dist/(totalSec/3600);

  return segments.map(seg=>{
    if(seg.type==="simple") return `${fmtSegDuration(seg.duration)} ${escapeHtml(seg.name)}`;
    return `${fmtSegDuration(seg.effortDuration)}/${fmtSegDuration(seg.recoveryDuration)} × ${seg.reps}`;
  }).join(" · ");
}

/* ============================= CARDIO — FRACTIONNÉ : chronomètre ============================= */
function flattenSegments(segments){
  const phases = [];
  segments.forEach(seg=>{
    if(seg.type==="simple"){
      phases.push({ label:seg.name, duration:seg.duration, kind:"simple" });
    } else {
      for(let i=0;i<seg.reps;i++){
        phases.push({ label:"Effort", duration:seg.effortDuration, kind:"effort" });
        phases.push({ label:"Récupération", duration:seg.recoveryDuration, kind:"recovery" });
      }
    }
  });
  return phases;
}
function startFractionneRunner(program){
  const phases = flattenSegments(program.segments);
  if(phases.length===0){ showToast("Cette séance ne contient aucune étape."); return; }
  if(state.cardioRunner && state.cardioRunner.intervalId) clearInterval(state.cardioRunner.intervalId);
  state.cardioRunner = {
    program, phases, phaseIndex:0, remaining:phases[0].duration, running:true,
    intervalId:null, startedAt:Date.now(), phaseEndAt: Date.now()+phases[0].duration*1000,
    effortDone:0, recoveryDone:0, intervalsCompleted:0, tickedWarn:false,
  };
  state.view = "cardio-fractionne-runner";
  render();
  announcePhase(phases[0]);
  requestNotifPermission();
  state.cardioRunner.intervalId = setInterval(tickRunner, 1000);
}
function tickRunner(){
  const r = state.cardioRunner;
  if(!r || !r.running) return;
  r.remaining = Math.max(0, Math.ceil((r.phaseEndAt - Date.now())/1000));
  if(r.remaining<=3 && r.remaining>0 && !r.tickedWarn){ r.tickedWarn = true; warnTick(); }
  if(r.remaining<=0){
    advanceRunnerPhase();
    return;
  }
  updateRunnerDOM();
}
function advanceRunnerPhase(){
  const r = state.cardioRunner;
  const finishedPhase = r.phases[r.phaseIndex];
  if(finishedPhase.kind==="effort"){ r.effortDone += finishedPhase.duration; r.intervalsCompleted += 1; }
  if(finishedPhase.kind==="recovery"){ r.recoveryDone += finishedPhase.duration; }
  r.phaseIndex += 1;
  r.tickedWarn = false;
  if(r.phaseIndex >= r.phases.length){
    finishRunner(true);
    return;
  }
  r.remaining = r.phases[r.phaseIndex].duration;
  r.phaseEndAt = Date.now() + r.phases[r.phaseIndex].duration*1000;
  beep();
  vibrate([150,80,150]);
  announcePhase(r.phases[r.phaseIndex]);
  notifyBackground(r.phases[r.phaseIndex].label, `${r.program.name} — étape ${r.phaseIndex+1}/${r.phases.length}`);
  render();
}
function skipRunnerPhase(){ advanceRunnerPhase(); }
function toggleRunnerPause(){
  const r = state.cardioRunner;
  if(r.running){
    r.remaining = Math.max(0, Math.ceil((r.phaseEndAt-Date.now())/1000));
    r.running = false;
  } else {
    r.phaseEndAt = Date.now() + r.remaining*1000;
    r.running = true;
  }
  render();
}
function confirmCancelRunner(){
  askConfirm("Annuler cette séance ? Elle ne sera pas enregistrée.", cancelRunner);
}
function cancelRunner(){
  if(state.cardioRunner && state.cardioRunner.intervalId) clearInterval(state.cardioRunner.intervalId);
  state.cardioRunner = null;
  showToast("Séance annulée");
  openFractionneList();
}
function confirmStopRunner(){
  askConfirm("Arrêter la séance ? Elle sera tout de même enregistrée avec la progression réalisée.", ()=>finishRunner(false));
}
async function finishRunner(completed){
  const r = state.cardioRunner;
  clearInterval(r.intervalId);
  const record = {
    id:"cardio_"+Date.now(), type:"fractionne", date:new Date().toISOString(),
    programName:r.program.name, structureSummary:summarizeSegments(r.program.segments),
    durationMs: Date.now()-r.startedAt,
    effortTotalSec:r.effortDone, recoveryTotalSec:r.recoveryDone, intervalsCount:r.intervalsCompleted,
  };
  state.historyList.unshift(record);
  await persistHistory();
  if(completed){ beep(); vibrate([200,100,200,100,200]); notifyBackground("Séance terminée !", r.program.name); }
  state.cardioRunner = null;
  showToast(completed ? "Séance de fractionné terminée !" : "Séance enregistrée");
  openHistoryDetail(record);
}
function updateRunnerDOM(){
  const r = state.cardioRunner;
  const digits = document.getElementById("runner-digits");
  const bar = document.getElementById("runner-bar-fill");
  const label = document.getElementById("runner-label");
  const next = document.getElementById("runner-next");
  if(!digits) return;
  const phase = r.phases[r.phaseIndex];
  digits.textContent = fmtTime(Math.max(0,r.remaining));
  const pct = phase.duration>0 ? Math.max(0,r.remaining)/phase.duration : 0;
  if(bar) bar.style.width = (pct*100)+"%";
  if(label){ label.textContent = phase.label; label.className = "runner-phase-label kind-"+phase.kind; }
  if(next){
    const np = r.phases[r.phaseIndex+1];
    next.textContent = np ? `Suivant : ${np.label} · ${fmtSegDuration(np.duration)}` : "Dernière étape";
  }
  const wrap = document.getElementById("runner-wrap");
  if(wrap) wrap.className = "runner-wrap kind-"+phase.kind;
}

    const totalSec = c.items.reduce((a,st)=>a+(st.sides?st.duration*2:st.duration),0);
    return `
    <div class="prog-card" onclick="openStretchCircuit('${key}')" style="border-left:3px solid var(--violet);">
      <div class="tag">Circuit</div>
      <h2 class="display">${c.name}</h2>
      <div class="meta">${c.tagline} · environ ${fmtClock(totalSec)}</div>
      <div class="arrow">${ICONS.chev}</div>
    </div>`;
  }).join("");
  return `
    <div class="topbar">
      <div class="back" onclick="goHome()">${ICONS.back}</div>
      <div><h1 class="display" style="font-size:22px">Circuits d'étirements</h1></div>
    </div>
    <p style="color:var(--text-muted); font-size:13.5px; margin:-10px 0 18px;">
      Choisis un circuit. Ces séances ne sont pas comptabilisées dans ton historique d'entraînement.
    </p>
    ${cards}
  `;
}

/* Écran de détail d'un circuit (liste des étirements + bouton Démarrer) */
function renderStretchCircuitDetail(){
  const key = state.stretchCircuitKey;
  const c = state.stretchCircuits[key];
  const editing = state.editingStretchCircuit;
  const rows = c.items.map((st,i)=>`
    <div class="stretch-row">
      <div>
        <h4>${st.name}${st.sides ? ' <span class="side-tag">G / D</span>' : ''}</h4>
        <span>${st.area}</span>
      </div>
      ${editing ? `
        <div class="stretch-edit-controls">
          <button class="stretch-move-btn" onclick="moveStretchItem('${key}',${i},-1)" ${i===0?'disabled':''}>${ICONS.arrowUp}</button>
          <button class="stretch-move-btn" onclick="moveStretchItem('${key}',${i},1)" ${i===c.items.length-1?'disabled':''}>${ICONS.arrowDown}</button>
          <div class="remove-x" onclick="removeStretchItem('${key}',${i})">${ICONS.close}</div>
        </div>
      ` : `<span class="stretch-dur">${st.sides ? `${st.duration}s ×2` : `${st.duration}s`}</span>`}
    </div>`).join("");
  const totalSec = c.items.reduce((a,st)=>a+(st.sides?st.duration*2:st.duration),0);
  return `
    <div class="topbar">
      <div class="back" onclick="openStretching()">${ICONS.back}</div>
      <div><h1 class="display" style="font-size:20px">${c.name}</h1></div>
      <div class="back manage-btn" onclick="toggleStretchEditMode()" title="Modifier le circuit">${editing ? ICONS.check : ICONS.edit}</div>
    </div>
    <p style="color:var(--text-muted); font-size:13.5px; margin:-10px 0 18px;">
      ${editing
        ? "Réorganise ou supprime des étirements avec les flèches et la croix."
        : `Durée totale : environ ${fmtClock(totalSec)}. Ce circuit n'est pas comptabilisé dans ton historique de séances.`}
    </p>
    <div class="stretch-list">${rows}</div>
    ${editing
      ? `<button class="cancel-link" onclick="confirmResetStretchCircuit('${key}')" style="margin-top:14px;">Réinitialiser ce circuit à sa version d'origine</button>`
      : `<button class="btn btn-primary btn-block" onclick="startStretchCircuit('${key}')" style="margin-top:18px;">${ICONS.play} Démarrer le circuit</button>`}
  `;
}

function renderStretchRunner(){
  const r = state.stretchRunner;
  const phase = r.phases[r.phaseIndex];
  const pct = phase.duration>0 ? Math.max(0,r.remaining)/phase.duration : 0;
  return `
    <div class="topbar">
      <div class="back" onclick="confirmCancelStretch()">${ICONS.back}</div>
      <div>
        <h1 class="display" style="font-size:18px">${state.stretchCircuits[r.circuitKey].name}</h1>
        <div class="sub">Étape ${r.phaseIndex+1} / ${r.phases.length}</div>
      </div>
    </div>
    <div class="runner-wrap kind-simple">
      <div class="runner-phase-label kind-simple" id="stretch-label">${phase.label}</div>
      <div class="runner-digits" id="stretch-digits">${fmtTime(r.remaining)}</div>
      <div class="runner-bar"><div class="runner-bar-fill" id="stretch-bar-fill" style="width:${pct*100}%"></div></div>
      <p class="stretch-cue" id="stretch-cue">${phase.cue}</p>
      <div class="runner-next" id="stretch-next">${r.phases[r.phaseIndex+1] ? `Suivant : ${r.phases[r.phaseIndex+1].label}` : "Dernier étirement"}</div>
    </div>
    <div class="rest-controls" style="max-width:none; margin-bottom:12px;">
      <button class="btn btn-steel btn-block" onclick="toggleStretchPause()">${r.running ? ICONS.pause+' Pause' : ICONS.play+' Reprendre'}</button>
      <button class="btn btn-ghost" style="flex:0 0 52px" onclick="skipStretchPhase()" title="Passer">${ICONS.arrowRight}</button>
    </div>
    <button class="cancel-link" onclick="confirmCancelStretch()">Arrêter le circuit</button>
  `;
}

/* ============================= RENDU ============================= */
function render(){
  const app = document.getElementById("app");
  const nav = document.getElementById("bottomnav");
  if(sessionClockInterval && state.view!=="session"){ stopSessionClock(); }
  switch(state.view){
    case "home": app.innerHTML = renderHome(); break;
    case "musculation": app.innerHTML = renderProgramCategoryList("musculation"); break;
    case "kettlebell": app.innerHTML = renderProgramCategoryList("kettlebell"); break;
    case "week": app.innerHTML = renderWeek(); break;
    case "session": app.innerHTML = renderSession(); attachSessionListeners(); break;
    case "cardio": app.innerHTML = renderCardioHome(); break;
    case "cardio-course": app.innerHTML = renderCardioCourse(); attachCoursePreview(); break;
    case "cardio-fractionne-list": app.innerHTML = renderFractionneList(); break;
    case "cardio-fractionne-builder": app.innerHTML = renderFractionneBuilder(); break;
    case "cardio-fractionne-runner": app.innerHTML = renderFractionneRunner(); break;
    case "stretching": app.innerHTML = renderStretchingHome(); break;
    case "stretching-detail": app.innerHTML = renderStretchCircuitDetail(); break;
    case "stretching-runner": app.innerHTML = renderStretchRunner(); break;
    case "history": app.innerHTML = renderHistoryList(); break;
    case "historyDetail": app.innerHTML = renderHistoryDetail(); break;
    case "profile": app.innerHTML = renderProfile(); break;
  }
  nav.innerHTML = renderNav();
  if(state.modalMessage) app.insertAdjacentHTML("beforeend", renderConfirmModal());
  if(state.view==="session"){ updateTimerDOM(); startSessionClock(); }
  if(state.view==="cardio-fractionne-runner" && state.cardioRunner) updateRunnerDOM();
  if(state.view==="stretching-runner" && state.stretchRunner) updateStretchRunnerDOM();
  if(state.view==="cardio-course") updateCoursePreview();
}
function attachCoursePreview(){ updateCoursePreview(); }

function renderConfirmModal(){
  return `
    <div class="rest-overlay confirm-overlay" style="z-index:80;">
      <div class="confirm-box">
        <p>${state.modalMessage}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost btn-block" onclick="cancelConfirm()">Annuler</button>
          <button class="btn btn-ember btn-block" onclick="execConfirm()">Confirmer</button>
        </div>
      </div>
    </div>
  `;
}

function renderNav(){
  const hasRunning = !!(state.activeSession || state.cardioRunner);
  const items = [
    {v:"home", icon:ICONS.home, label:"Accueil", active:["home"], onclick:"goHome()"},
    {v:"musculation", icon:ICONS.dumbbell, label:"Muscu", active:["musculation","week","session"], onclick:"openMusculation()"},
    {v:"cardio", icon:ICONS.run, label:"Cardio", active:["cardio","cardio-course","cardio-fractionne-list","cardio-fractionne-builder","cardio-fractionne-runner"], onclick:"openCardio()"},
    {v:"kettlebell", icon:ICONS.kb, label:"Kettlebell", active:["kettlebell"], onclick:"openKettlebell()"},
    {v:"history", icon:ICONS.clock, label:"Historique", active:["history","historyDetail"], onclick:"openHistory()"},
    {v:"profile", icon:ICONS.user, label:"Profil", active:["profile"], onclick:"openProfile()"},
  ];
  return items.map(it=>{
    const isActive = it.active.includes(state.view);
    const showPulse = (it.v==="musculation" && state.activeSession && state.activeSession.category==="musculation")
      || (it.v==="kettlebell" && state.activeSession && state.activeSession.category==="kettlebell")
      || (it.v==="cardio" && state.cardioRunner);
    return `
    <button class="nav-item ${isActive?'active':''}" onclick="${it.onclick}">
      <span class="dot">${it.icon}${showPulse ? '<span class="pulse"></span>':''}</span>
      ${it.label}
    </button>`;
  }).join("");
}

function findNextSuggestion(){
  const last = state.historyList.find(r=>
    (r.type==="musculation"||r.type==="kettlebell") && r.dayIndex!==undefined && STRENGTH_PROGRAMS[r.programKey]
  );
  if(!last) return { programKey:"fullbody", dayIndex:0, isFirst:true };
  const prog = STRENGTH_PROGRAMS[last.programKey];
  const nextIndex = (last.dayIndex+1) % prog.days.length;
  return { programKey:last.programKey, dayIndex:nextIndex, isFirst:false, lastLabel:last.label, lastDate:last.date };
}
function startSuggestedSession(programKey, dayIndex, category){
  state.programKey = programKey;
  state.weekParent = category;
  startDay(programKey, dayIndex);
}

function renderSession(){
  const s = state.activeSession;

    const allDone = e.sets.every(x=>x.done);
    const cls = i===s.currentIndex ? "current" : (allDone ? "done" : "");
    return `<div class="seg ${cls}" onclick="jumpToExercise(${i})" style="cursor:pointer"></div>`;
  }).join("");

  const setLabels = `<div class="set-labels"><span></span><span>Charge (kg)</span><span>Répétitions</span><span></span></div>`;
  const setsRows = ex.sets.map((st,i)=>`
    <div class="set-row" id="set-${s.currentIndex}-${i}">
      <div class="set-idx">#${i+1}</div>
      <input class="w-input" type="number" inputmode="decimal" placeholder="kg" value="${st.weight}" ${st.done?'disabled':''}>
      <input class="r-input" type="number" inputmode="numeric" placeholder="${ex.repsHint}" value="${st.reps}" ${st.done?'disabled':''}>
      <div class="validate ${st.done?'done':''}" onclick="${st.done ? `unvalidateSet(${s.currentIndex},${i})` : `validateSet(${s.currentIndex},${i})`}">

      </div>
    </div>`).join("");

  const variantOptions = ex.variants.map(v=>`<option value="${v}" ${v===ex.name?'selected':''}>${v}</option>`).join("");

  const restOptions = [60,90,120,180].map(r=>`<option value="${r}" ${r===ex.restTime?'selected':''}>${r}s</option>`).join("");

  const timerOverlay = state.timer.exerciseId!==null ? renderTimerOverlay(ex) : "";

  return `
    <div class="topbar">
      <div class="back" onclick="confirmLeaveSession()">${ICONS.back}</div>
      <div>
        <h1 class="display" style="font-size:20px">${s.label}</h1>
        <div class="sub">Exercice ${s.currentIndex+1} / ${total}</div>
      </div>
      <div class="session-clock mono" id="session-clock">00:00</div>

    </div>
    <div class="progress-strip">${strip}</div>

    <div class="exercise-card">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
        <span class="muscle-badge">${ex.muscle}</span>
        <div class="remove-x" onclick="confirmRemoveExercise(${s.currentIndex})" title="Supprimer cet exercice">${ICONS.close}</div>
      </div>
      <h2>${ex.name}</h2>

      <select class="variant-select" onchange="setVariant(${s.currentIndex}, this.value)">
        ${variantOptions}

      <div class="config-row">
        <div class="config-chip ${ex.seriesCount===3?'active':''}" onclick="setSeriesCount(${s.currentIndex},3)">

        <div class="config-chip ${ex.seriesCount===4?'active':''}" onclick="setSeriesCount(${s.currentIndex},4)">
          <span class="val">4</span>séries
        </div>
      </div>

      ${setLabels}
      ${setsRows}

      <div class="rest-inline">
        <label>Temps de repos</label>
        <select class="rest-select" onchange="ex_setRest(${s.currentIndex}, this.value)">${restOptions}</select>
      </div>
    </div>

    <div class="exercise-nav">
      <button class="btn btn-ghost" onclick="prevExercise()" ${s.currentIndex===0?'disabled':''}>← Précédent</button>
      <button class="btn btn-primary" onclick="nextExercise()" ${s.currentIndex===total-1?'disabled':''}>Suivant →</button>
    </div>

    <div class="end-bar">
      <button class="btn btn-ember btn-block" onclick="confirmEndSession()">Terminer la séance</button>
      <button class="cancel-link" onclick="confirmCancelSession()">Annuler la séance (ne rien enregistrer)</button>
    </div>

    ${timerOverlay}
    ${state.showManager ? renderManagerOverlay() : ""}

        <h4>${ex.name}</h4>

          <button class="btn btn-primary btn-block" onclick="openPicker()">${ICONS.plus} Ajouter un exercice</button>

function renderPicker(){
  const s = state.activeSession;
  const usedIds = new Set(s.exercises.map(e=>e.id));
  const groups = MUSCLE_GROUPS.map(group=>{
    const items = ALL_EXERCISE_IDS.filter(id=>EXERCISE_DB[id].muscle===group && !usedIds.has(id));
    if(items.length===0) return "";
    return `
      <div class="picker-group">
        <div class="picker-group-title">${group}</div>
        ${items.map(id=>`
          <div class="picker-item" onclick="addExerciseToSession('${id}')">
            <span>${EXERCISE_DB[id].name}</span>
            <span class="add-plus">${ICONS.plus}</span>
          </div>`).join("")}
      </div>`;
  }).join("");
  return `
    <div class="picker-wrap">
      <div class="picker-back" onclick="closePicker()">← Retour à la liste</div>
      <div class="picker-scroll">
        ${groups || `<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:20px 0;">Tous les exercices disponibles sont déjà dans la séance.</p>`}
      </div>
    </div>
  `;
}

function ex_setRest(exIndex, val){
  state.activeSession.exercises[exIndex].restTime = parseInt(val,10);

function renderTimerOverlay(ex){
  const t = state.timer;
  const circumference = 2*Math.PI*100;
  const pct = t.total>0 ? t.remaining/t.total : 0;
  const offset = circumference*(1-pct);
  return `
    <div class="rest-overlay">
      <div class="label">Temps de repos — ${ex.name}</div>
      <div class="timer-ring-wrap">
        <svg viewBox="0 0 220 220">
          <circle class="track" cx="110" cy="110" r="100"></circle>
          <circle id="timer-ring-fill" class="fill" cx="110" cy="110" r="100"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="digits" id="timer-digits">${fmtTime(t.remaining)}</div>
      </div>
      <div class="rest-controls">
        <button class="btn btn-ghost" style="flex:0 0 52px" onclick="resetTimer()">${ICONS.refresh}</button>
        <button class="btn btn-steel btn-block" onclick="toggleTimerPause()">${t.running ? ICONS.pause+' Pause' : ICONS.play+' Reprendre'}</button>
      </div>
      <button class="rest-skip" onclick="closeTimer()">Passer le repos</button>
    </div>
  `;
}

/* ---------- Progression par exercice (moyenne des charges validées, par séance) ---------- */
function getProgressExerciseNames(){
  const names = new Set();
  state.historyList.forEach(r=>{
    if(r.type==="musculation" || r.type==="kettlebell"){
      r.exercises.forEach(ex=>names.add(ex.name));
    }
  });
  return [...names].sort((a,b)=>a.localeCompare(b,"fr"));
}
function getProgressDataFor(name){
  const chronological = state.historyList
    .filter(r=>(r.type==="musculation"||r.type==="kettlebell"))
    .slice().reverse(); // l'historique est du plus récent au plus ancien -> on inverse pour tracer dans l'ordre chronologique
  const points = [];
  chronological.forEach(r=>{
    const ex = r.exercises.find(e=>e.name===name);
    if(!ex) return;
    const weights = ex.sets.map(s=>parseFloat(s.weight)).filter(w=>!isNaN(w) && w>0);
    if(weights.length===0) return;
    const avg = weights.reduce((a,b)=>a+b,0)/weights.length;
    points.push({ date:r.date, avg: Math.round(avg*10)/10 });
  });
  return points;
}
function setProgressExercise(name){ state.progressExercise = name; render(); }

/* ---- Période glissante de 6 mois pour le graphique de progression ---- */
function initProgressPeriod(){
  if(state.progressPeriodStart) return;
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth()-5); d.setHours(0,0,0,0);
  state.progressPeriodStart = d;
}
function progressPeriodEnd(){
  const end = new Date(state.progressPeriodStart);
  end.setMonth(end.getMonth()+6);
  return end;
}
function shiftProgressPeriod(delta){
  const d = new Date(state.progressPeriodStart);
  d.setMonth(d.getMonth()+delta*6);
  state.progressPeriodStart = d;
  render();
}
function progressPeriodLabel(){
  const end = new Date(progressPeriodEnd()); end.setDate(end.getDate()-1);
  const fmt = d=>d.toLocaleDateString("fr-FR",{month:"short",year:"numeric"});
  return `${fmt(state.progressPeriodStart)} → ${fmt(end)}`;
}

/* Graphique en courbe SVG dessiné à la main : aucune dépendance externe,
   fonctionne hors-ligne et dans n'importe quel environnement d'hébergement. */
function buildProgressSVG(points){
  const W=600, H=230, padL=38, padR=14, padT=26, padB=32;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const weights = points.map(p=>p.avg);
  let min = Math.min(...weights), max = Math.max(...weights);
  if(min===max){ min-=5; max+=5; }
  const pad = (max-min)*0.18 || 5;
  min -= pad; max += pad;
  const xFor = i => points.length===1 ? padL+plotW/2 : padL + (i/(points.length-1))*plotW;
  const yFor = v => padT + plotH - ((v-min)/(max-min))*plotH;
  const linePts = points.map((p,i)=>`${xFor(i).toFixed(1)},${yFor(p.avg).toFixed(1)}`).join(" ");
  const areaPts = `${xFor(0).toFixed(1)},${(padT+plotH).toFixed(1)} ${linePts} ${xFor(points.length-1).toFixed(1)},${(padT+plotH).toFixed(1)}`;
  const gridLines = [0,0.5,1].map(t=>{
    const y = padT + plotH*t;
    const val = (max - (max-min)*t).toFixed(1);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#5c5f63" font-family="JetBrains Mono">${val}</text>`;
  }).join("");
  const dots = points.map((p,i)=>{
    const x=xFor(i), y=yFor(p.avg);
    const label = new Date(p.date).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
    const labelAbove = y > padT+18;
    return `
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#c6ff3d" stroke="#151617" stroke-width="1.5"/>
      <text x="${x.toFixed(1)}" y="${(labelAbove ? y-12 : y+20).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#f2f2ef" font-family="JetBrains Mono" font-weight="700">${p.avg}</text>
      <text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#5c5f63" font-family="Inter">${label}</text>
    `;
  }).join("");
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:100%; display:block;" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <polygon points="${areaPts}" fill="rgba(198,255,61,0.12)" stroke="none"/>
      <polyline points="${linePts}" fill="none" stroke="#c6ff3d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>`;
}

function renderProgressView(){
  initProgressPeriod();
  const names = getProgressExerciseNames();
  if(names.length===0){
    return `<div class="empty-state"><p>Pas encore assez de données. Valide des séries avec des charges renseignées pour voir apparaître ta progression ici.</p></div>`;
  }
  if(!state.progressExercise || !names.includes(state.progressExercise)) state.progressExercise = names[0];
  const allPoints = getProgressDataFor(state.progressExercise);
  const start = state.progressPeriodStart, end = progressPeriodEnd();
  const points = allPoints.filter(p=>{ const d=new Date(p.date); return d>=start && d<end; });
  const first = points[0], last = points[points.length-1];
  const delta = (points.length>1) ? (last.avg-first.avg) : 0;

  return `
    <select class="variant-select" onchange="setProgressExercise(this.value)" style="margin-bottom:16px;">
      ${names.map(n=>`<option value="${n}" ${n===state.progressExercise?'selected':''}>${n}</option>`).join("")}
    </select>
    <div class="period-nav">
      <div class="back" onclick="shiftProgressPeriod(-1)">${ICONS.arrowLeft}</div>
      <span class="period-label">${progressPeriodLabel()}</span>
      <div class="back" onclick="shiftProgressPeriod(1)">${ICONS.arrowRight}</div>
    </div>
    ${points.length===0 ? `
      <div class="empty-state">
        <p>Aucune séance avec "${escapeHtml(state.progressExercise)}" sur cette période.${allPoints.length>0 ? " Essaie de naviguer vers une autre période." : ""}</p>
      </div>` : `
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${last.avg} kg</div><div class="l">Dernière moyenne</div></div>
        <div class="stat-box"><div class="n">${points.length}</div><div class="l">Séances</div></div>
        <div class="stat-box"><div class="n" style="color:${delta>=0?'var(--volt)':'var(--ember)'}">${delta>=0?'+':''}${delta.toFixed(1)} kg</div><div class="l">Sur la période</div></div>
      </div>
      <div class="chart-wrap">${buildProgressSVG(points)}</div>
    `}
  `;
}

/* ---------- Calendrier (rétrospective d'assiduité) ---------- */
function navigateMonth(delta){
  state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth()+delta, 1);
  state.calendarSelectedDate = null;
  render();
}
function selectCalendarDate(dateKey){
  state.calendarSelectedDate = state.calendarSelectedDate===dateKey ? null : dateKey;
  render();
}
function dateKeyOf(iso){ const d=new Date(iso); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function renderCalendar(){
  const month = state.calendarMonth;
  const year = month.getFullYear(), mIdx = month.getMonth();
  const monthLabel = month.toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
  const firstDay = new Date(year, mIdx, 1);
  const startOffset = (firstDay.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(year, mIdx+1, 0).getDate();

  const relevant = state.historyFilter==="all" ? state.historyList : state.historyList.filter(r=>r.type===state.historyFilter);
  const byDate = {};
  relevant.forEach(rec=>{
    const key = dateKeyOf(rec.date);
    if(!byDate[key]) byDate[key] = new Set();
    byDate[key].add(rec.type);
  });

  let cells = "";
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = `${year}-${mIdx}-${d}`;
    const types = byDate[key];
    const isSelected = state.calendarSelectedDate===key;
    const isToday = key===dateKeyOf(new Date().toISOString());
    let circleStyle = "";
    if(types){
      const colors = [...types].map(t=>`var(--${(CATEGORY_META[t]||CATEGORY_META.musculation).color})`);
      circleStyle = colors.length===1
        ? `background:${colors[0]};`
        : `background:conic-gradient(${colors.map((c,i)=>`${c} ${i*100/colors.length}% ${(i+1)*100/colors.length}%`).join(", ")});`;
    }
    cells += `<div class="cal-cell ${types?'has-session':''} ${isSelected?'selected':''} ${isToday?'today':''}" onclick="${types?`selectCalendarDate('${key}')`:''}">
      <span class="cal-daynum" style="${circleStyle}">${d}</span>
    </div>`;
  }

  let selectedSessions = "";
  if(state.calendarSelectedDate){
    const sessions = relevant.filter(r=>dateKeyOf(r.date)===state.calendarSelectedDate);
    selectedSessions = `<div class="cal-selected-list">${sessions.map(r=>renderHistCard(r)).join("")}</div>`;
  }

  return `
    <div class="cal-nav">
      <div class="back" onclick="navigateMonth(-1)">${ICONS.arrowLeft}</div>
      <h3 class="display" style="font-size:16px; text-transform:capitalize;">${monthLabel}</h3>
      <div class="back" onclick="navigateMonth(1)">${ICONS.arrowRight}</div>
    </div>
    <div class="cal-weekdays">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="cal-grid">${cells}</div>
    ${selectedSessions}
  `;
}

function renderProfile(){
  const totalSessions = state.historyList.length;
  const totalSets = state.historyList.reduce((a,r)=>a+(r.totalSets||0),0);
  const totalMs = state.historyList.reduce((a,r)=>a+(r.durationMs || (r.durationSec ? r.durationSec*1000 : 0)),0);
  const totalKm = state.historyList.filter(r=>r.type==="course").reduce((a,r)=>a+r.distanceKm,0);
  const storageBanner = storageBroken ? `
    <div class="storage-warning">
      <strong>⚠️ Sauvegarde indisponible</strong>
      <p>Le stockage n'est pas accessible depuis cette page. Tes données ne seront conservées que pour cette session — elles disparaîtront si tu fermes ou recharges l'app.</p>
      <p>Cause probable : le fichier est ouvert directement (file://) ou le navigateur est en navigation privée. Héberge le fichier <code>index.html</code> sur Netlify ou GitHub Pages pour que la sauvegarde fonctionne normalement.</p>
    </div>` : "";
  return `
    <div class="profile-hero">
      <div class="avatar display">F</div>
      <h1>Ton profil</h1>
      <p>Toutes tes données sont privées et stockées uniquement sur ton compte.</p>
    </div>
    ${storageBanner}
    <div class="settings-block">
      <div class="settings-row"><span class="k">Séances effectuées</span><span class="v">${totalSessions}</span></div>
      <div class="settings-row"><span class="k">Séries totales</span><span class="v">${totalSets}</span></div>
      <div class="settings-row"><span class="k">Distance parcourue</span><span class="v">${totalKm.toFixed(1)} km</span></div>
      <div class="settings-row"><span class="k">Temps total d'entraînement</span><span class="v">${totalMs>0?fmtDuration(totalMs):'0 min'}</span></div>
    </div>
    <div class="settings-block">
      <div class="settings-row"><span class="k">Version</span><span class="v" style="color:var(--text-muted)">MVP 1.2</span></div>
    </div>

    <div class="export-block">
      <h4>Sauvegarder / transférer mes données</h4>
      <p>Exporte tout ton contenu (séances, historique, préférences) dans un fichier unique. Utile pour garder une copie, changer d'appareil, ou me redonner tes données quand tu reviens faire évoluer l'app.</p>
      <div class="export-actions">
        <button class="btn btn-steel" onclick="exportData()">${ICONS.download} Exporter mes données</button>
        <button class="btn btn-ghost" onclick="triggerImportPicker()">${ICONS.upload} Importer</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json,.json" style="display:none" onchange="handleImportFile(this)">
    </div>

    <button class="danger-btn" onclick="resetAllData()">Réinitialiser toutes les données</button>
  `;
}

function attachSessionListeners(){
  if(state.timer.exerciseId!==null) updateTimerDOM();
}

/* ============================= INIT ============================= */
/* Filet de sécurité : force une resynchronisation immédiate des chronos actifs
   dès que l'app revient au premier plan (changement d'app, verrouillage d'écran…),
   au lieu d'attendre le prochain tick qui peut être retardé par le système. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible"){
    if(state.timer.running) tickTimer();
    if(state.cardioRunner && state.cardioRunner.running) tickRunner();
    if(state.stretchRunner && state.stretchRunner.running) tickStretchRunner();
  }
});

(async function init(){
  document.getElementById("app").innerHTML = `<div class="empty-state"><p>Chargement…</p></div>`;
  await checkStorageAvailability();
  await loadAll();
  render();
  if(storageBroken) warnStorageBrokenOnce();
})();
</script>
</body>
</html>
